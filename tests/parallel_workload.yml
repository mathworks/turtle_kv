script:
  - config:        
      initial_capacity_gb: 0
      max_capacity_gb: 8
      wal_size_mb: 256
      node_size_kb: 4
      leaf_size_kb: 1024
      key_size_hint: 24
      value_size_hint: 10
      chi: 2
  - create:
      remove_existing: True
  - open:
  - parallel:
      n_threads: 2
      stages:
        - insert:
            count: 1000000
            key_dist: uniform
            key_size: 24
            value_size: 10
            n_threads: 8
        - point_query:
            count: 1000000
            key_dist: zipf
            zipf_alpha: 0.99
